<!doctype html><html lang="es-EC"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula Virtual | Consultoría Sánchez</title><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="styles.css"></head>
<body class="app"><div class="wrap" id="root"></div><a class="wa" href="https://wa.me/593990795475?text=Hola%2C%20deseo%20informaci%C3%B3n%20sobre%20sus%20servicios" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp"><svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.2.6 4.4 1.7 6.3L3 29l7.3-1.9c1.8 1 3.8 1.5 5.8 1.5 7 0 12.7-5.6 12.7-12.6S23 3 16 3zm0 23.1c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.3 1.1 1.2-4.2-.3-.4a10.4 10.4 0 0 1-1.6-5.5C5.3 9.8 10.1 5.1 16 5.1s10.7 4.7 10.7 10.5S21.9 26.1 16 26.1zm5.9-7.8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.7s1.2 3.2 1.4 3.4c.2.2 2.4 3.6 5.7 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg></a>
<script src="common.js"></script><script>
const root=document.getElementById('root');
function loginView(){root.innerHTML=`<div class="panel"><h2 class="t" style="text-align:center">🎓 Aula Virtual</h2><p class="small" style="text-align:center">Plataforma de capacitación de Consultoría Sánchez</p>
<div class="tabs"><button id="t1" class="on">Usuario y contraseña</button><button id="t2">Código de acceso</button></div>
<form id="lf"><div id="f1"><label>Usuario<input id="u" autocomplete="username"></label><label>Contraseña<input id="p" type="password" autocomplete="current-password"></label></div>
<div id="f2" style="display:none"><label>Código de acceso<input id="c" placeholder="CS-XXXXXXXX" style="text-transform:uppercase"></label></div>
<p id="le" class="err"></p><button class="btn btn-aula" style="width:100%">Ingresar</button></form>
<p class="small" style="text-align:center">¿No tienes acceso? <a href="https://wa.me/593990795475" target="_blank">Contáctanos</a></p></div>`;
let mode=1;t1.onclick=()=>{mode=1;t1.className='on';t2.className='';f1.style.display='';f2.style.display='none'};
t2.onclick=()=>{mode=2;t2.className='on';t1.className='';f2.style.display='';f1.style.display='none'};
lf.onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{body:mode==1?{username:u.value,password:p.value}:{code:c.value}});init()}catch(x){le.textContent=x.message}}}
async function courseView(id){const c=await api('/api/my/courses/'+id);
 document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.id==id));
 main.innerHTML=`<span class="ph" style="background:#e6f5fc;color:#0B5C8A">${esc(c.area)}</span><h2 class="t">${esc(c.title)}</h2><p>${esc(c.description)}</p>`+
 (c.lessons.length?c.lessons.map((l,i)=>`<div class="lesson"><h3>Clase ${i+1}: ${esc(l.title)}</h3>${embed(l.video_url)||''}${(l.files||[]).map(f=>f.kind==='video'?embed(f.url):f.kind==='mp4'?`<video class="clip" controls src="${esc(f.href)}"></video><p class="small">${esc(f.title)}</p>`:`<p><a class="btn btn-sm btn-aula" href="${esc(f.href)}" target="_blank" rel="noopener">📎 ${esc(f.title)}</a></p>`).join('')}${!l.video_url&&!(l.files||[]).some(f=>f.kind==='video'||f.kind==='mp4')?'<p class="small">🎬 Video de la clase pendiente de publicar.</p>':''}<p style="white-space:pre-line">${esc(l.content)}</p>${l.material_url?`<a class="btn btn-sm btn-aula" href="${esc(l.material_url)}" target="_blank" rel="noopener">📎 Material de la clase</a>`:''}</div>`).join(''):'<p>Este curso aún no tiene clases.</p>')}
async function init(){let me;try{me=await api('/api/me')}catch{return loginView()}
 who.textContent='Hola, '+me.name;out.style.display='';
 const cs=await api('/api/my/courses');
 root.innerHTML=`<div class="layout"><aside class="side"><h3 style="margin:6px 10px">Mis cursos</h3>${cs.map(c=>`<a data-id="${c.id}">📘 ${esc(c.title)}</a>`).join('')||'<p class="small">Aún no estás inscrito en cursos.</p>'}<p class="sec">Capacitación MDT</p><a href="/igualdad">⚖️ Igualdad Salarial · 40 h</a>${me.role=='admin'?'<hr><a href="/admin">⚙️ Panel de administración</a>':''}</aside><div class="main" id="main"><h2 class="t">Bienvenido/a, ${esc(me.name)}</h2><p>Selecciona un curso para ver sus clases, videos y materiales. Los PDF y MP4 que suba administración se muestran en cada clase.</p><div class="card" style="margin-top:18px"><h3>Igualdad salarial · 40 horas</h3><p>Módulo para empresas, con enlace personal por trabajador. Quien no tiene enlace puede pedir el suyo a su empleador o a Consultoría Sánchez.</p><a class="btn btn-sm btn-aula" href="/igualdad">Abrir información del módulo</a></div></div></div>`;
 document.querySelectorAll('.side a[data-id]').forEach(a=>a.onclick=()=>courseView(a.dataset.id));if(cs[0])courseView(cs[0].id)}
init();
</script></body></html>
